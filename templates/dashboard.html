<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Your Message - Teachers' Day Portal</title>
</head>
<body style="margin: 0; padding: 0; height: 100vh; display: flex; justify-content: center; align-items: center; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">

    <!-- Glassmorphism Card Container -->
    <div style="background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(10px); padding: 40px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2); width: 100%; max-width: 420px; box-sizing: border-box;">
        
        <h2 style="text-align: center; color: #333; margin-top: 0; margin-bottom: 25px; font-size: 24px;">Submit Your Message</h2>

        <form action="/submit-letter" method="POST">
            
            <!-- Recipient Field -->
            <div style="margin-bottom: 20px;">
                <label for="recipient" style="display: block; margin-bottom: 8px; color: #555; font-weight: 600; font-size: 14px;">To:</label>
                <select id="recipient" name="recipient" required style="width: 100%; padding: 12px 15px; border: 1px solid #ddd; border-radius: 10px; background: #fff; font-size: 14px; outline: none; box-sizing: border-box;">
                    <option value="" disabled selected>Mr./Ms./Mrs. ...</option>
                    <option value="Mr. Smith">Mr. Smith</option>
                    <option value="Ms. Davis">Ms. Davis</option>
                    <option value="Mrs. Garcia">Mrs. Garcia</option>
                </select>
            </div>

            <!-- Message Box -->
            <div style="margin-bottom: 20px;">
                <textarea id="content" name="content" placeholder="Type your message here..." required style="width: 100%; height: 120px; padding: 12px 15px; border: 1px solid #ddd; border-radius: 10px; background: #fff; font-size: 14px; outline: none; resize: none; box-sizing: border-box;"></textarea>
            </div>

            <!-- Name / Anonymous Textbox -->
            <div style="margin-bottom: 25px;">
                <input type="text" id="sender" name="sender" placeholder="You can input your name or stay anonymous." style="width: 100%; padding: 12px 15px; border: 1px solid #ddd; border-radius: 10px; background: #fff; font-size: 13px; outline: none; box-sizing: border-box;">
            </div>

            <!-- Hidden input for theme compatibility -->
            <input type="hidden" name="color_theme" value="default-black">

            <!-- Action Buttons -->
            <button type="submit" style="width: 100%; padding: 12px; background: #667eea; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.3s; margin-bottom: 15px;">Send</button>
            
            <div style="text-align: center;">
                <a href="/login" style="color: #667eea; text-decoration: none; font-size: 14px; font-weight: 500;">Back to Login</a>
            </div>

        </form>
    </div>

</body>
</html>
